[project]
name = "polaroids"
version = "0.5.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cole Hudson", email = "m.cole.hudson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "polars>=1.40.0",
]


[build-system]
