[project]
name = "polaroids"
version = "1.0.0"
description = "Ergonomic column accessors and IDE type stub generation for Polars DataFrames and LazyFrames."
readme = "README.md"
authors = [
    { name = "Cole Hudson", email = "m.cole.hudson@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "polars>=1.40.0",
]


[build-system]
requires = ["uv_build>=0.11.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

